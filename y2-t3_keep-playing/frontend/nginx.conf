server {
    listen 80;
    server_name localhost;

    # Media uploads served directly from the shared `media_data` volume rather
    # than proxied through Django's static.serve (which has no caching and
    # isn't production-hardened).
    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location ~ ^/(api|login|logout|admin|users|user|coach|organiser|new_coach|new_organiser|event|hello|health|static)(/|$) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10M;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
