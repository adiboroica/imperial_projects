[project]
name = "cyoa-backend"
version = "0.1.0"
description = "Choose Your Own Adventure - FastAPI backend for AI-assisted gamebook generation"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "motor>=3.6.0",
    "pymongo>=4.10.0",
    "openai>=2.29.0",
    "bcrypt>=4.2.0",
    "pydantic[email]>=2.10.0",
    "slowapi>=0.1.9",
    "cryptography>=42.0.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=2.2.2",
    "torch>=2.0.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "mongomock-motor>=0.0.30",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pip-audit>=2.7.0",
    "import-linter>=2.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "N"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["motor.*", "slowapi.*", "sentence_transformers.*", "docx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]
